name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, setup]

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Build
        run: |
          if [ -d src ]; then
            npm run build
          else
            echo "No src directory yet — skipping build"
          fi

      - name: Validate plugin.json
        run: node -e "JSON.parse(require('fs').readFileSync('plugin.json','utf8')); console.log('plugin.json is valid')"

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is valid')"
